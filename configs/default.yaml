# chile-tailings-monitor — default configuration.
# Relative paths are resolved against the repository root (the parent of configs/).

seed: 42

paths:
  data_dir: data
  scenes_dir: data/scenes            # per-scene .npz (image, valid, polygon_mask, meta)
  tiles_dir: data/tiles              # 256x256 training tiles, data/tiles/<deposit_id>/*.npz
  weak_labels_dir: data/weak_labels
  reference_dir: data/reference      # manual reference masks (needed for val/test scoring)
  runs_dir: data/runs                # checkpoints + metric logs, one sub-dir per run
  deposits: configs/deposits.geojson
  crest_lines: configs/crest_lines.geojson
  catalog: data/catalog.parquet          # one row per (deposit, scene) on the fixed tile
  catalog_tiles: data/catalog_tiles.parquet   # candidate MGRS tiles and scene counts
  catalog_parts: data/catalog_parts      # per-deposit cache (resume)
  samples_dir: data/samples              # train / series scene selections
  annotation_dir: annotation             # git-ignored; imagery + mask templates
  reports_dir: reports
  # Committed on purpose (not under data/): git history is the audit trail of the OOS run.
  test_lock: reports/locks/test_evaluation.lock

stac:
  endpoint: https://earth-search.aws.element84.com/v1
  collection: sentinel-2-l2a
  date_start: "2019-01-01"
  date_end: "2026-12-31"
  max_scene_cloud_cover: 40          # eo:cloud_cover filter on the whole tile (%)
  bbox_buffer_m: 300                 # buffer around the deposit polygon before clipping
  require_full_coverage: true        # skip items whose footprint does not contain the bbox
  # Band order defines the channel order of every array downstream.
  bands: [B02, B03, B04, B08, B11, B12]
  # Earth Search v1 asset keys for each band.
  asset_keys:
    B02: blue
    B03: green
    B04: red
    B08: nir
    B11: swir16
    B12: swir22
    SCL: scl
  target_resolution_m: 10
  # B11/B12 (20 m) -> 10 m grid of B02. Reflectance: bilinear. SCL: always nearest.
  resampling: bilinear
  # Fallback DN->reflectance if an asset lacks raster:bands scale/offset metadata.
  # Earth Search encodes the PB>=04.00 offset (-0.1) per asset; we always read it from there.
  default_scale: 0.0001
  default_offset: 0.0
  # SCL classes always treated as invalid:
  # 0 no data, 1 saturated/defective, 8 cloud medium, 9 cloud high, 10 thin cirrus,
  # 11 snow/ice. Water (6) and dark area (2) are kept on purpose.
  scl_invalid_classes: [0, 1, 8, 9, 10, 11]
  # Cloud shadow (3) is invalid ONLY if cloud pixels (classes below) lie within
  # shadow_cloud_radius_m of the bbox: dark water is often labelled as shadow.
  scl_shadow_class: 3
  scl_shadow_cloud_classes: [8, 9, 10]
  shadow_cloud_radius_m: 1500
  min_valid_fraction: 0.8            # inside the polygon; scenes below are discarded

catalog:
  workers: 16                        # concurrent SCL reads
  # Tile choice per deposit: among MGRS tiles whose footprint contains the
  # deposit bbox, the one with most acquisitions in [date_start, date_end]
  # (no cloud filter). Ties -> alphabetical tile id.

sampling:
  clean_min_valid_fraction: 0.95     # "clean" scene (valid fraction inside polygon)
  train_per_month: 2                 # max clean scenes per deposit and calendar month
  train_min_days_apart: 10           # between the scenes picked in one month
  series_min_valid_fraction: 0.8     # all scenes at/above go into the time series

annotation:
  splits: [val, test]
  scenes_per_deposit: 8
  seed: 20260706
  min_valid_fraction: 0.9            # candidate pool for annotation
  # Mandatory windows, filled first (best valid fraction) if any scene exists.
  mandatory:
    - {start: "2026-07-01", end: "2026-07-31"}
    - {start: "2026-08-01", end: "2026-08-31"}
  mandatory_min_valid_fraction: 0.8
  # Southern-hemisphere seasons (month numbers)
  seasons:
    summer: [12, 1, 2]
    autumn: [3, 4, 5]
    winter: [6, 7, 8]
    spring: [9, 10, 11]
  stretch_percentiles: [2, 98]
  min_coverage: 0.98                 # validator: labelled fraction of polygon pixels

diagnostics:
  low_cloud_max: 10                  # scene eo:cloud_cover (%) considered "low"
  bright_class_threshold: 0.10       # class 8/9/10/11 fraction in polygon to flag a scene
  flag_min_share: 0.10               # flag deposit if >= this share of low-cloud scenes hit

derived:
  beach_inset_m: 30                  # polygon eroded inward before computing beach fraction
  min_valid_fraction: 0.8            # of the inset polygon; below -> NaN

baseline:
  green_band: B03
  swir_band: B11
  min_valid_pixels: 200              # inside polygon; below -> fixed fallback threshold
  fallback_threshold: 0.0            # MNDWI > 0 => water, used when Otsu is not defined
  eps: 1.0e-6

labels:
  ignore_index: 255                  # clouds, outside polygon, no data

tiling:
  tile_size: 256
  stride: 256                        # == tile_size -> no overlap for training tiles
  min_valid_fraction: 0.3            # drop tiles with fewer labelled pixels

model:
  arch: unet
  encoder: resnet34
  encoder_weights: imagenet          # null => random init (no download)
  in_channels: 6
  classes: 1
  # Per-band standardisation. Must be computed on TRAIN deposits only (M1).
  # null => identity (reflectance passed as-is).
  norm_mean: null
  norm_std: null

train:
  device: auto                       # auto | cuda | cpu
  epochs: 50
  batch_size: 16
  num_workers: 4
  lr: 3.0e-4
  weight_decay: 1.0e-4
  amp: true
  amp_dtype: bfloat16
  deterministic: true
  bce_weight: 0.5                    # loss = w*BCE + (1-w)*Dice
  threshold: 0.5                     # sigmoid threshold for metrics / masks

inference:
  tile_size: 256
  overlap: 64
